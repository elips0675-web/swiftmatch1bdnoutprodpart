server_tokens off;

# Rate limiting (этап 44). Zone объявляется на http-уровне файла: внутри
# `server` nginx её не принимает («directive is not allowed here»). Значения
# согласованы с `nginx/swiftmatch.http.conf` (тот, что едет в образ) и
# проверяются гейтом `npm run check:headers`.
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

upstream swiftmatch_api {
  server 127.0.0.1:3002;
}

server {
  listen 80;
  server_name swiftmatch.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name swiftmatch.app;

  ssl_certificate     /etc/ssl/certs/swiftmatch.crt;
  ssl_certificate_key /etc/ssl/private/swiftmatch.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  client_max_body_size 20M;

  root /var/www/swiftmatch/dist;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 256;

  # Security headers (этап 38).
  #
  # ВАЖНО, это и есть тот самый footgun: nginx наследует `add_header` с
  # верхнего уровня, только если на текущем уровне НЕ объявлено ни одного
  # `add_header`. Ниже все три `location` объявляют свой `Cache-Control`, и до
  # этапа 38 security-заголовки на уровне server из-за этого НЕ доходили до
  # ответов — в конфиге они были, в ответах их не было. Проверяет
  # `npm run check:headers`.
  #
  # `X-XSS-Protection "1; mode=block"` удалён: директива устарела и в старых IE
  # сама вносила XSS (OWASP рекомендует значение 0, то есть отсутствие).
  # `X-Frame-Options`, а не `frame-ancestors` в CSP: `frame-ancestors` браузером
  # игнорируется в <meta http-equiv> (см. index.html).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Static files (with aggressive cache)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location /uploads/ {
    proxy_pass http://swiftmatch_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # API proxy
  location /api/auth/ {
    limit_req zone=auth burst=50 nodelay;
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Socket.IO
  location /socket.io/ {
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Без явных таймаутов WS рвётся на дефолтных 60s (в образе — 86400s).
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  access_log /var/log/nginx/swiftmatch_access.log;
  error_log  /var/log/nginx/swiftmatch_error.log;
}
