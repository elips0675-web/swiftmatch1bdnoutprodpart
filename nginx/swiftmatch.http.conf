server_tokens off;

upstream swiftmatch_api {
  server app:3002;
  keepalive 64;
}

# Security-заголовки (этап 38). ВАЖНО: nginx наследует `add_header` с верхнего
# уровня, только если на текущем уровне НЕ объявлено ни одного `add_header`.
# Поэтому в любом `location`, где есть свой `add_header Cache-Control`,
# security-заголовки нужно повторить явно — иначе они молча теряются, хотя в
# конфиге выглядят как настроенные. Гейт: `npm run check:headers`.
#
# `X-Frame-Options`, а не `frame-ancestors` в CSP: `frame-ancestors` браузером
# игнорирует в <meta http-equiv> (см. index.html), а `X-Frame-Options` работает
# везде. HSTS здесь не нужен — контейнер слушает HTTP за TLS-терминатором.

# Rate limiting (zone на http-уровне, server вне — иначе "not allowed here")
# api: 60r/s burst=120 — прод-агрессивность при необходимости ужесточить,
# но полный E2E-прогон забрасывает десятки API-запросов разом (сервисы параллельно).
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  client_max_body_size 20M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location /api/auth/ {
    limit_req zone=auth burst=50 nodelay;
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location /uploads/ {
    proxy_pass http://swiftmatch_api;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Статика из этапа web (/usr/share/nginx/html)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
