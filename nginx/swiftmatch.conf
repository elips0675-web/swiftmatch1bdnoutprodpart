server_tokens off;

upstream swiftmatch_api {
  server app:3002;
  keepalive 64;
}

server {
  listen 80;
  server_name swiftmatch.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name swiftmatch.app;

  ssl_certificate     /etc/ssl/certs/swiftmatch.crt;
  ssl_certificate_key /etc/ssl/private/swiftmatch.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 20M;

  # Security-заголовки (этап 38). Повторяются в каждом `location` со своим
  # `add_header` — см. пояснение в `nginx/swiftmatch.http.conf`. Гейт:
  # `npm run check:headers`.

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location /uploads/ {
    proxy_pass http://swiftmatch_api;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    root /app/dist;
    index index.html;
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
