name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: npx vite build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  # Дрейф схемы: каждая колонка, которую читает код в server/src, должна
  # существовать в эталоне database/mysql_schema.sql. Без MySQL — только эта
  # половина проверки; полный режим (с живой БД) ловит ещё и «колонка есть в
  # эталоне, но не создана миграцией» — см. бэклог (P1: MySQL-service в CI).
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/schema-drift-audit.mjs --offline

  # Секреты и мусор не должны попадать в артефакты (этап 20, P0-C). Ловит два
  # канала: контекст сборки образа (.dockerignore) и rsync --delete на деплое
  # (deploy.yml) — оба молчаливые, оба срабатывали на каждом пуше в main.
  secrets-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/secrets-leak-audit.mjs