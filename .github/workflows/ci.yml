name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/
      - run: npx vite build

  # Гейт «typecheck реально проверяет код» (P3 #37). До этого джоба lint
  # запускала голый `npx tsc --noEmit`, а корневой tsconfig.json — solution-
  # конфиг со ссылками и `"files": []`: компилятор без `-p` проверял ноль
  # файлов, и гейт был зелёным на любом коде. Теперь типчек собирает оба
  # проекта (`npm run typecheck`: tsconfig.app.json + tsconfig.node.json), а
  # этот шаг доказывает, что скрипт и workflow не вернулись к проверке
  # пустого множества. Зависимости не нужны: гейт читает файлы.
  typecheck-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:typecheck

  # Линтинг бэкенда (этап 29, B1). До этого конфиг ESLint покрывал только
  # `**/*.{ts,tsx}` — 131 файл server/src не проверялся линтером вообще.
  # Отдельная джоба, а не шаг в `lint`: та джоба делает `npx eslint src/`
  # (только фронт), и расширение её до бэкенда тихо смешало бы два разных
  # по смыслу гейта — фронтовый (tsc + eslint + build) и серверный.
  # Зависимости сервера не нужны: eslint и конфиг живут в корневом
  # node_modules, линтер работает по исходникам и ничего не импортирует.
  # Что находит: неиспользуемые импорты/переменные (в т.ч. параметр
  # query-фильтра, который разбирается, но не применяется), no-undef,
  # require-yield, no-useless-catch, no-useless-escape.
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:server

  # E2E обязателен на любом push/PR (этап 30, B2). До этого он жил только в
  # deploy.yml, а тот триггерится на push в main/develop и PR в main — на
  # фиче-ветке E2E не шёл вообще, и джоба e2e-test была зелёной вакансией.
  # Рецепт ниже повторяет deploy.yml шаг в шаг; расхождение между ними ловит
  # `npm run check:e2e`.
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: swiftmatch_test
      DB_NAME: swiftmatch_test
      JWT_SECRET: ci-e2e-secret-not-for-production-0123456789
      REVENUECAT_WEBHOOK_SECRET: ci-e2e-revenuecat-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix server
      - name: Init DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
      - run: node scripts/seed-migrations.mjs
      - run: node database/migrations/migrate.js
      # Без сида демо-данных global-setup не сможет залогиниться за
      # user2@mail.ru/admin@mail.ru: в mysql_schema.sql нет ни одного
      # INSERT INTO users, поэтому все четыре storageState остаются пустыми.
      - run: node server/src/seed.js
      - run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          node server/src/index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
      - name: Wait for API
        run: node scripts/wait-for-url.mjs http://127.0.0.1:3002/health --status 200 --timeout 120000
      - name: Build frontend
        run: npx vite build
      - name: Start frontend
        run: |
          npx vite preview --port 8081 --strictPort > /tmp/front.log 2>&1 &
          echo $! > /tmp/front.pid
      - name: Wait for frontend
        run: node scripts/wait-for-url.mjs http://127.0.0.1:8081 --timeout 120000
      - run: npm run test:e2e
      - name: Cleanup E2E data
        if: always()
        run: node scripts/e2e-cleanup.mjs
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/front.pid) 2>/dev/null || true
          kill $(cat /tmp/api.pid) 2>/dev/null || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Живой MySQL обязателен, иначе «гонки на настоящем движке» (P0 #2,
  # race.mysql.test.js) не выполняются никогда. Прежде у джобы не было сервиса
  # БД, а тест был написан как `describe.skipIf(!admin)`: джоба честно зеленела
  # при полном пропуске единственного живого теста репозитория. Теперь сервис
  # объявлен, а REQUIRE_MYSQL=1 превращает отсутствие БД в падение; локально без
  # БД файл по-прежнему пропускается, чтобы `npm test` у разработчика не краснел.
  # Структуру джобы проверяет гейт scripts/mysql-race-gate.mjs.
  #
  # Тот же приём — для очередей: юнит-тесты queue-monitor.test.js гоняют ветки
  # getJobCounts/getFailed/retry на фейке, а без сервиса Redis смоук
  # server/scripts/queue-smoke.mjs не выполнялся бы ни разу. Сервис redis,
  # REDIS_URL и REQUIRE_REDIS=1 делают отсутствие Redis падением; структуру
  # проверяет гейт scripts/queue-smoke-gate.mjs.
  test-server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: swiftmatch_test
      REQUIRE_MYSQL: '1'
      REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_REDIS: '1'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/queue-smoke.mjs

  # Гейт «живой тест на MySQL действительно выполняется» (этап 36, N1).
  # Проверяет три вещи, которые вместе дают зелёную джобу при полном пропуске
  # теста: сервис mysql в test-server, REQUIRE_MYSQL=1 и «пропуск превращается в
  # падение» в самом race.mysql.test.js. Локально гейт зелёный на честном
  # окружении без БД — он проверяет структуру, а не наличие соединения.
  mysql-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mysql-race-gate.mjs

  # Гейт «смоук очередей на живом Redis действительно выполняется».
  # Проверяет три вещи: сервис redis в test-server, REQUIRE_REDIS=1 и «пропуск
  # превращается в падение» в самом server/scripts/queue-smoke.mjs. Локально гейт
  # зелёный на честном окружении без Redis — он проверяет структуру, а не соединение.
  queue-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/queue-smoke-gate.mjs

  # Гейт «backup/restore smoke действительно восстанавливает ДАННЫЕ» (TEST-02).
  # Шаг в `server-test` (deploy.yml) был заведён, но снимал дамп с `--no-data`
  # и восстанавливал пустую схему: ни одна строка не сверялась, а ошибки
  # восстановления гасились самодельным разбором дампа и `catch {}`. Гейт
  # проверяет структуру джобы и самого смоука: дамп с данными, канарейка со
  # «сложными» значениями, сверка числа строк, восстановление клиентом mysql,
  # падение вместо пропуска. Локально зелёный без MySQL — он про структуру.
  backup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backup-smoke-gate.mjs

  # Интеграционный прогон TEST-03: настоящий server/src/index.js против живых
  # контейнеров mysql:8.4 + redis:7-alpine + maildev (SMTP-ловушка). Ни один
  # мок не проверяет путь целиком: HTTP → MySQL (INSERT users) → Bull/Redis →
  # nodemailer → реальный SMTP-сервер → письмо в maildev → login → /auth/me.
  # Контур поднимается override'ом поверх docker-compose.yml (docker-comp-
  # ose.integration.yml: те же db/redis, что поедут на VPS, порты !override
  # мимо занятых), REQUIRE_INTEGRATION=1 превращает отсутствие любой
  # зависимости в падение, а runner убирает контейнеры и volume в finally
  # (down -v — уборка не побочный эффект). Структуру держит гейт
  # scripts/integration-smoke-gate.mjs. Docker на ubuntu-latest предустановлен.
  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # смоук импортирует mysql2/promise из server/node_modules
      - run: npm ci --prefix server
      - run: node scripts/integration-smoke-gate.mjs
      - run: node scripts/integration-smoke-run.mjs
        env:
          REQUIRE_INTEGRATION: '1'

  # Дрейф схемы: каждая колонка, которую читает код в server/src, должна
  # существовать в эталоне database/mysql_schema.sql. Здесь — offline-половина
  # (MySQL не нужен). Live-режим (`node scripts/schema-drift-audit.mjs`) сверяет
  # ещё и с настоящей БД: ловит «колонка есть в эталоне, но не создана
  # миграцией» и «код читает колонку, которой на живой БД нет». Он запускается
  # в server-test (deploy.yml, реальный MySQL) и на VPS после migrate.js.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/schema-drift-audit.mjs --offline

  # Пагинация обязана быть детерминированной: `ORDER BY created_at LIMIT 20`
  # без замыкателя по уникальному столбцу даёт между страницами дубли и
  # пропуски — строка, попавшая в конец первой страницы, может попасть и в
  # начало второй (живой баг был в ленте, hangouts.js). Гейт разбирает SQL в
  # строковых литералах server/src, сверяет последний термин ORDER BY с
  # PRIMARY KEY/UNIQUE главной таблицы и ругается на неоднозначный `id`
  # (MySQL отдаст ER_NON_UNIQ_ERROR, то есть 500). Запросы без LIMIT не
  # проверяет: там страниц нет, порядок только «дёргается».
  order-by:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/order-by-audit.mjs

  # Секреты и мусор не должны попадать в артефакты (этап 20, P0-C). Ловит два
  # канала: контекст сборки образа (.dockerignore) и rsync --delete на деплое
  # (deploy.yml) — оба молчаливые, оба срабатывали на каждом пуше в main.
  secrets-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/secrets-leak-audit.mjs

  # Счётчики тестов в документации не должны расходиться с прогоном. Гейт
  # перезапускает vitest (корень + server) и `playwright test --list`, сверяет
  # измеренные числа с README / project-context / test/ИНВЕНТАРЬ-ТЕСТОВ.md и
  # падает на расхождении. Нужен отдельный job: `lint-and-typecheck`-подобные
  # джобы делают только root `npm ci`, а без `server/node_modules` измерить
  # серверные тесты нечем. E2E считается статически (--list). Окружение обязано
  # совпадать с тем, в котором снят test/machine/test-inventory.json: `passed` сверяет
  # pushSuiteDiff, а без сервиса mysql молча пропускаются 6 тестов
  # race.mysql.test.js, без живого API на 3002 — ещё 7 тестов
  # security.headers.test.js (describe.skipIf(!serverUp)), и прогон даёт 972/973
  # против 979 в инвентаре. Сервис mysql и живой сервер ниже — тот же паттерн,
  # что в джобе e2e-test.
  test-counters:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: swiftmatch_test
      DB_NAME: swiftmatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix server
      - name: Start server (живой API для теста заголовков)
        run: |
          PORT=3002 JWT_SECRET=ci-counters-jwt-secret node server/src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
      - name: Wait for API
        run: node scripts/wait-for-url.mjs http://127.0.0.1:3002/health --status 200 --timeout 120000
      - run: node scripts/test-counter-audit.mjs
      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  # Данные на диске переживают пересоздание контейнера (этап 21, P0 #37).
  # `docker compose up -d --build` пересоздаёт контейнер, и всё, что не
  # смонтировано volume'ом, исчезает. Гейт выводит путь записи фото из кода
  # и сверяет его с compose: раньше каталога не было вовсе, и каждый деплой
  # удалял загруженные фото без единой записи в логах.
  deploy-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/deploy-persistence-audit.mjs

  # Выкладка обязана доказать, что версия поднялась (health-gate по пробе из
  # docker-compose.yml), и уметь откатиться: снимок предыдущих образов под
  # тегом :rollback снимается ДО сборки, а падение любого шага (health,
  # миграция, schema-drift) запускает отдельный шаг отката с if: failure().
  # Без тега `:rollback` откатывать физически нечего — гейт держит именно
  # структуру, а не слово «rollback» в комментарии.
  deploy-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:deploy-rollout

  # Корневой .env.example обязан документировать все ключи server/.env.example:
  # docker-compose (сервис app) читает КОРНЕВОЙ .env (env_file), поэтому ключ,
  # описанный только в серверном шаблоне, в контейнер не попадёт (P2 #34).
  env-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-env-parity.mjs

  # E2E объявлен обязательным гейтом (этап 30, B2) — проверяем, что он и правда
  # обязательный, а рецепт в ci.yml и deploy.yml не разошёлся. Сам E2E здесь не
  # запускается (нужна MySQL и два сервиса — это джоба `e2e`).
  e2e-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:e2e

  # Целостность зависимостей (этап 31, P1-B5). Гейт двусторонний: импортируемое
  # объявлено (иначе на чистой машине ENOENT, причём у разработчика работает за
  # счёт транзитивной установки) и объявленное в dependencies используется (иначе
  # мёртвый пакет едет в образ через npm ci --omit=dev). Нужен `npm ci`: гейт
  # разбирает спецификаторы через AST typescript, а не регуляркой по тексту —
  # регулярка цепляла упоминания пакета в JSDoc и в строковых фикстурах тестов.
  dependency-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:deps

  # Раскладка документации (этап 32). Проверяет, что `Промты.txt` остался
  # указателем на канон (а не второй копией правил), идеи 21–34 на месте в
  # `docs/product-roadmap.md`, архив `context.txt` помечен как срез, а в
  # отслеживаемых .md/.txt нет запрещённых формулировок («adminAuth … passive»
  # и «Zod 4»). Ни MySQL, ни npm ci не нужны — только git ls-files.
  docs-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:docs

  # SQL внутри цикла (этап 33, N5). Гейт искал такие места с самого начала,
  # но не был вызван ниоткуда — скрипт, который никто не запускает, не
  # защищает ничего. К моменту подключения он был красным (3 новых места),
  # и два из них стоили реальных запросов: рассылка уведомлений об отмене
  # встречи делала по два запроса на каждого участника, а профиль писал
  # `user_interests` по одному INSERT на интерес. Гейт также проверяет, что
  # оправдания из `JUSTIFIED` не протухли: они держат номера строк, а код
  # сдвигается — без якоря `expect` оправдание молча перестаёт работать.
  # Зависимости не нужны: гейт читает исходники, импортов не делает.
  n-plus-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:n-plus-one

  # CHECK/ENUM в схеме против валидаторов кода (этап 37, N4). MySQL отвечает на
  # нарушение ограничения не 400, а 500: ограничение живёт в
  # `database/mysql_schema.sql`, а проверяет его код. Схему и код читать
  # достаточно, живая БД не нужна — гейт зелёный локально и в CI одинаково.
  # Зависимости не нужны: гейт читает исходники, импортов не делает.
  enum-constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:enum-constraints

  # Переменные окружения: код против эталонов (этап 45, N7). Класс дыр —
  # «работает у меня»: `process.env.X` на сервере и `import.meta.env.X` на
  # фронте читаются кодом, но не объявлены ни в `server/.env.example`, ни в
  # корневом `.env.example`, ни в docker-compose (environment сервиса app) —
  # на VPS/CI переменная undefined и код молча уходит в fallback. На момент
  # подключения гейт поймал две реальные дыры: `ALLOW_UNMODERATED_PHOTOS`
  # (runtime.js) и `API_URL` (swagger.js) — ни та, ни другая не была
  # задокументирована. Зависимости не нужны: гейт читает исходники.
  env-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:env

  # Swagger-документация против кода (этап 45, N7). Класс дыр — «документация
  # живёт своей жизнью»: `@openapi`-аннотации собираются в Swagger UI и
  # /api-docs.json, но могут описывать путь, которого в коде нет (Swagger UI
  # показывает эндпоинт с 404), либо молча исчезнуть при рефакторинге (фронт,
  # читающий контракт, теряет его). Гейт держит базу в 47 операций (этап 13),
  # сверяет каждый документированный путь с кодом и ловит мёртвые операции
  # (путь есть, метода нет). Зависимости не нужны: свой парсер JSDoc.
  swagger-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:swagger-coverage

  # Mock-платежи не утекают в прод (N9-tail, после этапа 39). Класс дыр —
  # «пять точек закрыты, шестая появится завтра»: `refuseMockPayment` стоит в
  # коде, но новая mock-ветка в PR останется незамеченной и отдаст товар
  # бесплатно. Гейт ищет в `server/src/routes/*.js` платные стоки
  # (`mock: true`, `'paid'`, `INSERT INTO … subscriptions`,
  # `commission_rate = 15`) и требует fail-closed `refuseMockPayment(res)` в
  # том же хендлере; вебхуки (`received: true`) — осознанный контракт Stripe,
  # вне проверки. Зависимости не нужны: гейт читает исходники.
  prod-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:prod-mock

  # Уязвимости в prod-зависимостях — гейт без `npm ci`: аудиту нужен только
  # lock-файл, поэтому джоба делает ровно две команды (корень и server) и
  # проверяет обе половины: в контейнер едут обе, а не только фронт.
  # `--omit=dev` — в образ ставится только прод-часть (`npm ci --omit=dev` в
  # Dockerfile), `--audit-level=high` — иначе джоба краснеет от moderate и
  # low, которые чинятся мажорными обновлениями и не являются нашим регрессом.
  # Гейт блокирующий сразу: измерено 0 high / 0 critical в корне и в server.
  # Trivy в deploy.yml смотрит образы (базовые слои), этот — resolved-зависимости
  # по lock-файлу; дублируют друг друга на уровнях ОС и npm.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run audit:prod
      - run: npm run audit:prod
        working-directory: server

  # Заголовки безопасности на периметре (этап 38, доделано этапом 43). Гейт
  # лежал в дереве с коммита 3f1d826, но его не вызывал ни один workflow —
  # скрипт, который никто не запускает, не защищает ничего. Проверяет все три
  # nginx-конфига (в образ едет swiftmatch.http.conf — в нём до этапа 38 не
  # было ни одного заголовка), наследование add_header (с верхнего уровня
  # директива не действует, если на текущем объявлен свой), vercel.json,
  # index.html и порядок helmet()/express.static. Статический: доказывает, что
  # заголовки объявлены, а не что сервер их отдаёт — живой ответ проверяет
  # security.headers.test.js на поднятом стенде.
  # Зависимости не нужны: гейт читает файлы, импортов не делает.
  security-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:headers

  # Правила алертинга — настоящий файл, который реально загружается (этап 48).
  # Дашборд Grafana показывает график, но не сообщает, когда он плохой: без файла
  # правил алертов нет. И файла мало: Prometheus читает только то, что в
  # rule_files, а путь из rule_files должен быть смонтирован в контейнер. Гейт
  # проверяет три звена (файл/метрики/подключение) без зависимостей: метрики он
  # берёт из исходника server/src/metrics.js, а не из списка внутри себя.
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:alerts

  # Зеркала `test/` побайтово. Раньше гейт лежал только локально и скипал на
  # отсутствии зеркал (свежий клон получал часть пар, остальные молча
  # пропускались) — «гейт зелёный, потому что проверять нечего». Теперь все 8
  # пар трекаются в git, а гейт вызывается из CI: забытый синк зеркала после
  # правки канона — красный PR, а не тихое устаревание (как было с VAPID-ключом
  # в устаревшем зеркале журнала). Зависимости не нужны: сверка sha256 по парам.
  mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:mirrors

  # Выборка чужого профиля/фото обязана быть под блок-предикатом (остатки свода
  # 15.10.2026, питфолл 46). Блок-лист — это SQL-предикат, а не проверка в JS,
  # поэтому `SELECT display_name FROM user_profiles WHERE id = ?` отдаёт имя
  # заблокированного. Гейт требует notBlocked/blockFilter, пометку
  # `@public: <причина>` в самом SQL или строку в JUSTIFIED с якорем; проверяет
  # и то, что оправдание не протухло при сдвиге строки. Зависимости не нужны:
  # гейт читает исходники server/src.
  blocks-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:blocks-coverage

  # Query-параметр прочитан и забыт (остатки свода 15.10.2026). Класс: фронт
  # шлёт `?premium=1`, бэкенд читает `req.query.premium` и нигде не использует —
  # фильтр молча не работает, и такое ищется глазами. Правило узкое (используется
  # либо само имя, либо переменная, куда связано значение), поэтому находок ноль;
  # границы правила описаны в шапке скрипта. Зависимости не нужны.
  query-param:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:query-param

  # БД, отставшая от миграций, обязана краснить дрейф-аудит (питфолл 99).
  # Отдельная джоба, а не шаг в test-server: нужен живой MySQL и КОРНЕВЫЕ
  # зависимости (mysql2), а test-server работает в server/ и корневые
  # node_modules не ставит. REQUIRE_MYSQL=1 превращает отсутствие БД в падение,
  # а не в зелёный пропуск. Структуру парсера держат тесты в корневом vitest
  # (scripts/migrations-lag-audit.test.mjs, джоба `test`); здесь — живой прогон.
  migrations-lag:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: swiftmatch_test
      DB_NAME: swiftmatch_test
      REQUIRE_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:migrations-lag