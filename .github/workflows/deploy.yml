name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check:ports
      - run: npm run lint
      # Линтинг бэкенда (этап 29): `npm run lint` = `eslint .` и после этапа 29
      # покрывает server/src, но шаг остаётся явным — иначе сужение `lint` до
      # фронта снова отключит проверку бэкенда молча, ровно как это было.
      - run: npm run lint:server
      # Реальный типчек обоих проектов (P3 #37): голый `npx tsc --noEmit`
      # проверял корневой tsconfig.json с "files": [] — ноль файлов.
      - run: npm run typecheck
      # Структурный гейт того же: scripts.typecheck собирает tsconfig.app.json +
      # tsconfig.node.json с -p/--noEmit, workflow не вызывают голый tsc, include
      # проектов покрывают реальные файлы (иначе typecheck снова проверяет пустое
      # множество). Зависимости не нужны: гейт читает файлы.
      - run: npm run check:typecheck
      # Блокирующий гейт перед любым деплоем (этап 20, P0-C). Проверяет, что
      # .dockerignore и rsync-строка ниже не пропускают секреты: иначе прод
      # стартует с публичным JWT_SECRET, а node_modules с хоста (dev-зависимости
      # и Windows-бинарники sharp) затирает npm ci --omit=dev внутри образа.
      - run: node scripts/secrets-leak-audit.mjs
      # Этап 21 (P0 #37): фото не должны теряться при `docker compose up --build`.
      - run: node scripts/deploy-persistence-audit.mjs
      - run: npm run check:deploy-rollout
      # Этап 28: пагинация детерминирована (замыкатель по PK главной таблицы).
      # Ловит `ORDER BY created_at LIMIT ?` без замыкателя — между страницами
      # дубли и пропуски. Чистый Node, зависимостей не требует.
      - run: npm run check:order-by
      # Уязвимости high/critical в prod-зависимостях (этап 23). Блокирует деплой
      # так же, как secrets-leak выше: в образ едет только прод-часть
      # (`npm ci --omit=dev`), и именно её дерево резолвится по lock-файлу.
      # Аудит не требует `npm ci` — достаточно lock-файла, поэтому джоба делает
      # ровно две быстрые команды вместо полной установки зависимостей.
      - run: npm run audit:prod
      - run: npm run audit:prod
        working-directory: server
      # Этап 30 (B2): E2E объявлен обязательным гейтом. Проверяем, что он и
      # правда обязательный (джоба e2e в ci.yml на любом push/PR, deploy зависит
      # от e2e-test) и что рецепт способен стать зелёным: сид демо-данных,
      # ожидание готовности вместо sleep, vite preview --strictPort. Проверка
      # не запускает сам Playwright — это джоба e2e-test ниже.
      - run: npm run check:e2e
      # Этап 31 (P1-B5): целостность package.json в обе стороны — импортируемое
      # объявлено, объявленное в dependencies используется. Блокирует деплой так
      # же, как secrets-leak: мёртвая runtime-зависимость едет в образ, а
      # необъявленная ломает сборку на любой машине, где нет случайной
      # транзитивной установки.
      - run: npm run check:deps
      # Этап 32: раскладка документации. Блокирует деплой, потому что
      # неправильная раскладка документации стоила реальной дыры в защите:
      # `Промты.txt` предлагал сделать adminAuth пассивным, и агент, читающий
      # этот файл, снимал бы гейт /api/admin. Гейт читает только git ls-files.
      - run: npm run check:docs
      # Этап 38/43: заголовки безопасности на периметре. Блокирует деплой,
      # потому что helmet() ставит заголовки только на ответы Express, а SPA
      # и статику отдаёт nginx — в образ едет nginx/swiftmatch.http.conf, и до
      # этапа 38 в нём не было ни одного security-заголовка. Второй класс дыр:
      # наследование add_header — с верхнего уровня директива не действует,
      # если на текущем уровне объявлен свой add_header.
      - name: check:headers
        run: npm run check:headers
      # Этап 33 (N5): SQL внутри цикла. Блокирует деплой по той же причине,
      # что и check:order-by: гейт существовал, но не был вызван ниоткуда, и к
      # моменту подключения держал 3 новых места, включая рассылку
      # уведомлений об отмене встречи (по два запроса на участника).
      - run: npm run check:n-plus-one
      # Этап 36 (N1): живой тест на MySQL обязан выполняться. Блокирует деплой,
      # потому что джоба test-server годами была зелёной при полном пропуске
      # единственного теста на настоящем движке: сервиса БД у неё не было, а файл
      # был написан как describe.skipIf(!admin). Гейт проверяет, что сервис
      # объявлен, REQUIRE_MYSQL=1 задан и отсутствие БД — падение, а не пропуск.
      - run: npm run check:mysql-race
      # Структурный гейт смоука очередей: сервис redis в test-server,
      # REQUIRE_REDIS=1 и «отсутствие Redis — падение, а не пропуск» в
      # server/scripts/queue-smoke.mjs. Блокирует деплой по той же причине, что и
      # check:mysql-race: джоба не должна зеленеть, не выполнив смоук на живом движке.
      - run: npm run check:queue-smoke
      # Этап 37 (N4): CHECK/ENUM схемы против валидаторов кода. MySQL отвечает
      # на нарушение ограничения 500, а не 400 — ограничение живёт в схеме, а
      # проверяет его код. Гейт ловит четыре класса: код-валидатор шире CHECK,
      # диапазонный CHECK без проверки в пишущем файле, белый список кода с
      # значением вне ENUM и литерал в INSERT/UPDATE, которого нет в ENUM.
      - run: npm run check:enum-constraints
      # Этап 45 (N7): переменные окружения против эталонов. Блокирует деплой,
      # потому что «работает у меня» стоит реальных инцидентов: переменная
      # читается кодом, но нигде не задокументирована — на VPS она undefined,
      # код молча уходит в fallback, а коллега даже не узнает, что настройка
      # существует. При подключении пойманы ALLOW_UNMODERATED_PHOTOS и API_URL.
      - run: npm run check:env
      # P2 #34: корневой .env.example обязан документировать все ключи бэкенда.
      # docker-compose (app) читает КОРНЕВОЙ .env, поэтому ключ только из
      # server/.env.example до контейнера не доедет.
      - run: npm run check:env-parity
      # Этап 45 (N7): Swagger-документация против кода. Блокирует деплой,
      # потому что документация живёт своей жизнью: аннотация может описывать
      # путь, которого в коде нет (Swagger UI показывает 404), или молча
      # исчезнуть при рефакторинге (фронт теряет контракт). Гейт держит базу
      # в 47 операций (этап 13), сверяет документированные пути с кодом и
      # ловит мёртвые операции (путь есть, метода нет).
      - run: npm run check:swagger-coverage
      # N9-tail (после этапа 39): mock-платежи не утекают в прод. Блокирует
      # деплой, потому что `refuseMockPayment` стоит в пяти сегодняшних точках,
      # а новая mock-ветка в PR отдаст товар бесплатно. Гейт требует
      # fail-closed отказ в каждом хендлере с платным стоком; вебхуки
      # (`received: true`) — контракт Stripe, вне проверки.
      - run: npm run check:prod-mock
      # Зеркала `test/` побайтово. Раньше гейт жил только локально и скипал на
      # отсутствии зеркал («зелёный, потому что проверять нечего»); теперь все
      # 9 пар трекаются в git, а гейт блокирует деплой: забытый синк зеркала
      # после правки канона — красный шаг, а не тихое устаревание.
      - run: npm run check:mirrors
      # Остатки свода 15.10.2026: выборка чужого профиля/фото обязана быть под
      # блок-предикатом (питфолл 46). Блок-лист — SQL-предикат, а не проверка в
      # JS: запрос по id без него отдаёт имя заблокированного. Гейт принимает
      # notBlocked/blockFilter, пометку `@public` в SQL или строку JUSTIFIED с
      # якорем; протухшее оправдание — красный шаг.
      - run: npm run check:blocks-coverage
      # Остатки свода 15.10.2026: query-параметр прочитан и забыт. Фронт шлёт
      # `?premium=1`, бэкенд читает `req.query.premium` и не использует — фильтр
      # молча не работает. Правило узкое, находок ноль; границы — в шапке скрипта.
      - run: npm run check:query-param
      # Этап 48: правила алертинга — настоящий файл, который реально загружается.
      # Блокирует деплой, потому что «дашборды без оповещений» — тишина, которую
      # замечают только на инциденте: нет файла правил, либо Prometheus его не
      # читает (не в rule_files) или не находит (путь не смонтирован), либо
      # метрика в expr написана с опечаткой и правило не сработает никогда.
      - run: npm run check:alerts

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --reporter=verbose
      - name: Android cleartext guard (этап 35)
        run: node scripts/check-native-config.mjs
      - run: npx vite build

  server-test:
    name: Server Tests (Vitest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install root deps (database/scripts use mysql2)
        run: npm ci
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Init test DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
        env:
          MYSQL_PWD: swiftmatch_test
      - name: Seed applied migrations (этап 79)
        run: node scripts/seed-migrations.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Apply DB migrations (этап 78)
        run: node database/migrations/migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Validate schema vs live DB (этап 35)
        run: node scripts/schema-validate.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Schema drift — код + эталон против живой БД (L5)
        run: node scripts/schema-drift-audit.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      # Питфолл 99: оффлайн-аудит схемы зелёный, а живая БД отстала от миграций —
      # код читает колонку, которой в БД нет, и это живой 500. Гейт собирает
      # scratch-БД из mysql_schema.sql, по одной снимает колонки последних
      # миграций и требует, чтобы дрейф-аудит краснел именно на читаемой кодом
      # колонке (COLUMN_MISSING_IN_CODE), а на полной схеме был зелёным.
      # Отдельная джоба в CI (migrations-lag); здесь — тот же шаг перед деплоем.
      - name: Migrations lag detected by drift audit (питфолл 99)
        run: node scripts/migrations-lag-audit.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
          REQUIRE_MYSQL: '1'
      - name: EXPLAIN audit all SQL queries
        run: node scripts/sql-explain-audit.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Backup restore smoke test
        run: node scripts/verify-backup.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - run: npm test -- --reporter=verbose
        working-directory: server
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
          JWT_SECRET: ci-test-jwt-secret-key
          PORT: 3002
      - name: Queue smoke (живой Redis)
        run: node scripts/queue-smoke.mjs
        working-directory: server
        env:
          REDIS_URL: redis://127.0.0.1:6379
          REQUIRE_REDIS: '1'

  # Счётчики тестов в документации сверяются с прогоном: README,
  # project-context и test/ИНВЕНТАРЬ-ТЕСТОВ.md хранят числа, и они устаревают
  # каждый раз, когда добавлен тест. Отдельная джоба (нужны root и server
  # node_modules), в needs деплоя — иначе расхождение всплывёт уже на VPS.
  # Окружение обязано совпадать с тем, в котором снят test/machine/test-inventory.json:
  # `passed` сверяет pushSuiteDiff, а без сервиса mysql молча пропускаются 6
  # тестов race.mysql.test.js, без живого API на 3002 — ещё 7 тестов
  # security.headers.test.js (describe.skipIf(!serverUp)), и прогон даёт 972/973
  # против 979 в инвентаре.
  test-counters:
    name: Test counters vs docs
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: swiftmatch_test
      DB_NAME: swiftmatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - name: Start server (живой API для теста заголовков)
        run: |
          PORT=3002 JWT_SECRET=ci-counters-jwt-secret node server/src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
      - name: Wait for API
        run: node scripts/wait-for-url.mjs http://127.0.0.1:3002/health --status 200 --timeout 120000
      - run: node scripts/test-counter-audit.mjs
      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  e2e-test:
    name: E2E Tests (Playwright)
    needs: [lint-and-typecheck, frontend-test, server-test]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: swiftmatch_test
      DB_NAME: swiftmatch_test
      JWT_SECRET: ci-e2e-jwt-secret
      REVENUECAT_WEBHOOK_SECRET: ci-e2e-revenuecat-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install frontend deps
        run: npm ci
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Init DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
      - name: Seed applied migrations (этап 79)
        run: node scripts/seed-migrations.mjs
      - name: Apply DB migrations (этап 78)
        run: node database/migrations/migrate.js
      # Сид демо-данных (этап 30): без него global-setup не может залогиниться
      # за user2@mail.ru/admin@mail.ru — в mysql_schema.sql нет ни одного
      # INSERT INTO users, все четыре storageState остаются пустыми, и 13
      # тестов падают на пустом стенде. Шаг отсутствовал, поэтому джоба
      # e2e-test никогда не была зелёной, а deploy зависит от неё.
      - name: Seed demo data
        run: node server/src/seed.js
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build frontend
        run: npx vite build
      - name: Start server
        run: |
          PORT=3002 node server/src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
      - name: Wait for API (этап 30)
        run: node scripts/wait-for-url.mjs http://127.0.0.1:3002/health --status 200 --timeout 120000
      - name: Start frontend
        run: |
          npx vite preview --port 8081 --strictPort &
          echo "VITE_PID=$!" >> $GITHUB_ENV
      - name: Wait for frontend (этап 30)
        run: node scripts/wait-for-url.mjs http://127.0.0.1:8081 --timeout 120000
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Cleanup E2E data
        if: always()
        run: node scripts/e2e-cleanup.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop services
        if: always()
        run: |
          kill $VITE_PID 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true

  docker-config-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    env:
      # Дефолтный timeout Trivy — 5m0s, и часть его уходит на загрузку базы
      # уязвимостей: action кэширует её по дате (cache-trivy-<дата>), то есть раз
      # в сутки 127 МБ качаются заново. Локальный замер: 4 м 34 с при ~1.2 MB/s,
      # после чего скан падал с «context deadline exceeded». Переменную читает
      # сам Trivy; вход `timeout` у action пуст, поэтому значение не перетирается
      # и действует на все шаги сканирования в этой джобе.
      TRIVY_TIMEOUT: 15m0s
    steps:
      - uses: actions/checkout@v4
      # Сервис `app` объявляет `env_file: - .env` (docker-compose.yml:83-84), а
      # `.env` в git нет — на свежем checkout `docker compose config` падает
      # (`env file …/.env not found`) ещё до сборки образов. Bootstrap как в
      # deploy-джобе (:498): шаблон → рабочий `.env`.
      - name: Prepare root .env (compose env_file)
        run: test -f .env || cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      # Раньше здесь был `docker build ... | tail -5`: в GH Actions шаг идёт через
      # `bash -e`, а код возврата пайпа берётся у последней команды, то есть у
      # `tail`. Сломанная сборка давала exit 0 и зелёную галочку — гейт не
      # проверял ничего. Теперь пайпа нет, ошибка сборки валит шаг.
      - name: Build server Docker image
        run: docker build --target server -t swiftmatch-server-check .
      - name: Build web (nginx) Docker image
        run: docker build --target web -t swiftmatch-web-check .

      # ─── Trivy: уязвимости в образах (P3 #25) ───────────────────────────────
      # Сканируются ровно те образы, которые едут в прод: два собранных выше
      # плюс четыре сторонних из docker-compose.yml (db/redis/prometheus/grafana).
      # exit-code: 0 — первый прогон только собирает базовую линию (локально
      # Docker/Trivy на машине нет, базу смотреть было негде). Как только
      # baseline зафиксирован в артефакте, переводим на exit-code: 1 + .trivyignore
      # на осознанно принятые находки. SARIF уходит только по нашим образам:
      # CVE в чужих образах — не наш код, в Security-вкладке они только шумят.
      - name: Prepare Trivy output dir
        run: mkdir -p trivy
      - name: Trivy — server image (prod artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-server-check
          format: table
          output: trivy/server.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — web/nginx image (prod artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-web-check
          format: table
          output: trivy/web.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image mysql (docker-compose db)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mysql:8.4
          format: table
          output: trivy/base-mysql.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image redis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: redis:7-alpine
          format: table
          output: trivy/base-redis.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image prometheus
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/prometheus:v3.15.0
          format: table
          output: trivy/base-prometheus.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image grafana
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: grafana/grafana:13.2.3
          format: table
          output: trivy/base-grafana.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — SARIF for our own images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-server-check
          format: sarif
          output: trivy/server.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — SARIF for web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-web-check
          format: sarif
          output: trivy/web.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Print scan results
        run: |
          for f in trivy/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy/server.sarif
          category: trivy-server-image
      - name: Upload SARIF (web) to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy/web.sarif
          category: trivy-web-image
      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan
          path: trivy/
          retention-days: 30

  deploy:
    name: Deploy to Production (Docker)
    needs: [lint-and-typecheck, frontend-test, server-test, e2e-test, test-counters]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push raw files to VPS via rsync
        uses: burnett01/rsync-deployments@9.0.1
        with:
          switches: -avz --delete --exclude node_modules --exclude .git --exclude test-results --exclude playwright-report --exclude e2e/.auth --exclude .env --exclude '.env.*' --exclude '*.secret' --exclude '*-secret' --exclude '*.pem' --exclude '*.key' --exclude '*.p12' --exclude '*.pfx' --exclude 'id_*' --exclude uploads
          path: ./
          remote_path: /app/swiftmatch
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: 22
      - name: Build & migrate & deploy via Docker
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /app/swiftmatch
            # Health-gate (и шаг отката) проверяют опубликованный порт через curl
            # на самом VPS. Нет curl — падаем сразу, до любых изменений: иначе
            # разбор уйдёт в сторону «health не поднялся», хотя сервис цел
            # (docs/AGENTS-deployment.md, раздел «Деплой и откат»).
            command -v curl >/dev/null 2>&1 || { echo "FAIL: на VPS нет curl — им проверяется подъём сервиса (docs/AGENTS-deployment.md)"; exit 1; }
            # Прод-секреты лежат на VPS в /app/swiftmatch/.env (в git их нет).
            # Этап 20: rsync выше теперь исключает .env, поэтому --delete больше
            # НЕ стирает файл и эта строка срабатывает только на первом деплое.
            # Если .env всё же отсутствует, compose поднимет контейнер с
            # JWT_SECRET из шаблона, а middleware.js в production такой старт
            # отвергает — намеренно громко, вместо тихо сломанной подписи.
            test -f .env || cp .env.example .env
            # Цель отката: образ работающей версии под тегом :rollback. Сборка
            # ниже переназначает только :latest, поэтому :rollback сохраняет
            # предыдущий образ и откат возможен без пересборки.
            if docker image inspect swiftmatch-app:latest >/dev/null 2>&1; then
              docker tag swiftmatch-app:latest swiftmatch-app:rollback
              docker tag swiftmatch-web:latest swiftmatch-web:rollback
              echo "rollback target: swiftmatch-app:rollback, swiftmatch-web:rollback"
            else
              echo "rollback target: нет (первый деплой с этими именами образов)"
            fi
            # Собрать образы и запустить compose (schema применяется при первичном старте
            # пустого DB volume через docker-entrypoint-initdb.d — см. docker-compose.yml).
            # --wait не отдаёт управление, пока сервисы с healthcheck не станут
            # healthy: «контейнер запущен» != «API отвечает».
            docker compose up -d --build --wait
            # Health-gate отдельной проверкой: --wait молчит про сервисы без
            # healthcheck и не проверяет ответ через nginx.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3002/health >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "${ok:-}" != "1" ]; then
              echo "FAIL: health не поднялся за 150 c (app:3002/health или web:8080)"
              exit 1
            fi
            # Применить новые миграции && проверить схему против кода
            docker compose exec -T app node database/migrations/migrate.js
            docker compose exec -T app node scripts/schema-validate.mjs
            # L5: код + mysql_schema.sql против ЖИВОЙ БД VPS. Здесь БД строилась
            # миграциями, поэтому ловится колонка из эталона, которую ни одна
            # миграция не создала (в CI база строится из эталона — этот класс
            # виден только на реальной БД).
            docker compose exec -T app node scripts/schema-drift-audit.mjs
            docker compose ps

      # Откат на предыдущий образ: отдельный шаг с if: failure(), потому что
      # падение посреди ssh-скрипта (health-gate, миграция, schema-drift)
      # оставляет прод на новой версии — без автоматического отката он лежит
      # до ручного вмешательства.
      - name: Rollback on failed deploy
        if: failure()
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /app/swiftmatch
            if ! docker image inspect swiftmatch-app:rollback >/dev/null 2>&1; then
              echo "FAIL: образа отката нет — откатывать не на что, поднимите вручную (docs/rollback-plan.md)"
              exit 1
            fi
            docker tag swiftmatch-app:rollback swiftmatch-app:latest
            docker tag swiftmatch-web:rollback swiftmatch-web:latest
            # --no-build: вернуть именно предыдущий образ, а не пересобрать код
            # из рабочей копии; миграции не откатываются (forward-only) — см.
            # docs/rollback-plan.md.
            docker compose up -d --no-build --wait
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3002/health >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "${ok:-}" != "1" ]; then
              echo "FAIL: откат не поднялся — ручной план: docs/rollback-plan.md"
              exit 1
            fi
            echo "OK: откат на предыдущий образ выполнен, health отвечает"
