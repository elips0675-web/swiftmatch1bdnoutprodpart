name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check:ports
      - run: npm run lint
      # Линтинг бэкенда (этап 29): `npm run lint` = `eslint .` и после этапа 29
      # покрывает server/src, но шаг остаётся явным — иначе сужение `lint` до
      # фронта снова отключит проверку бэкенда молча, ровно как это было.
      - run: npm run lint:server
      - run: npx tsc --noEmit
      # Блокирующий гейт перед любым деплоем (этап 20, P0-C). Проверяет, что
      # .dockerignore и rsync-строка ниже не пропускают секреты: иначе прод
      # стартует с публичным JWT_SECRET, а node_modules с хоста (dev-зависимости
      # и Windows-бинарники sharp) затирает npm ci --omit=dev внутри образа.
      - run: node scripts/secrets-leak-audit.mjs
      # Этап 21 (P0 #37): фото не должны теряться при `docker compose up --build`.
      - run: node scripts/deploy-persistence-audit.mjs
      # Этап 28: пагинация детерминирована (замыкатель по PK главной таблицы).
      # Ловит `ORDER BY created_at LIMIT ?` без замыкателя — между страницами
      # дубли и пропуски. Чистый Node, зависимостей не требует.
      - run: npm run check:order-by
      # Уязвимости high/critical в prod-зависимостях (этап 23). Блокирует деплой
      # так же, как secrets-leak выше: в образ едет только прод-часть
      # (`npm ci --omit=dev`), и именно её дерево резолвится по lock-файлу.
      # Аудит не требует `npm ci` — достаточно lock-файла, поэтому джоба делает
      # ровно две быстрые команды вместо полной установки зависимостей.
      - run: npm run audit:prod
      - run: npm run audit:prod
        working-directory: server
      # Этап 30 (B2): E2E объявлен обязательным гейтом. Проверяем, что он и
      # правда обязательный (джоба e2e в ci.yml на любом push/PR, deploy зависит
      # от e2e-test) и что рецепт способен стать зелёным: сид демо-данных,
      # ожидание готовности вместо sleep, vite preview --strictPort. Проверка
      # не запускает сам Playwright — это джоба e2e-test ниже.
      - run: npm run check:e2e
      # Этап 31 (P1-B5): целостность package.json в обе стороны — импортируемое
      # объявлено, объявленное в dependencies используется. Блокирует деплой так
      # же, как secrets-leak: мёртвая runtime-зависимость едет в образ, а
      # необъявленная ломает сборку на любой машине, где нет случайной
      # транзитивной установки.
      - run: npm run check:deps
      # Этап 32: раскладка документации. Блокирует деплой, потому что
      # неправильная раскладка документации стоила реальной дыры в защите:
      # `Промты.txt` предлагал сделать adminAuth пассивным, и агент, читающий
      # этот файл, снимал бы гейт /api/admin. Гейт читает только git ls-files.
      - run: npm run check:docs
      # Этап 38/43: заголовки безопасности на периметре. Блокирует деплой,
      # потому что helmet() ставит заголовки только на ответы Express, а SPA
      # и статику отдаёт nginx — в образ едет nginx/swiftmatch.http.conf, и до
      # этапа 38 в нём не было ни одного security-заголовка. Второй класс дыр:
      # наследование add_header — с верхнего уровня директива не действует,
      # если на текущем уровне объявлен свой add_header.
      - name: check:headers
        run: npm run check:headers
      # Этап 33 (N5): SQL внутри цикла. Блокирует деплой по той же причине,
      # что и check:order-by: гейт существовал, но не был вызван ниоткуда, и к
      # моменту подключения держал 3 новых места, включая рассылку
      # уведомлений об отмене встречи (по два запроса на участника).
      - run: npm run check:n-plus-one
      # Этап 36 (N1): живой тест на MySQL обязан выполняться. Блокирует деплой,
      # потому что джоба test-server годами была зелёной при полном пропуске
      # единственного теста на настоящем движке: сервиса БД у неё не было, а файл
      # был написан как describe.skipIf(!admin). Гейт проверяет, что сервис
      # объявлен, REQUIRE_MYSQL=1 задан и отсутствие БД — падение, а не пропуск.
      - run: npm run check:mysql-race
      # Этап 37 (N4): CHECK/ENUM схемы против валидаторов кода. MySQL отвечает
      # на нарушение ограничения 500, а не 400 — ограничение живёт в схеме, а
      # проверяет его код. Гейт ловит четыре класса: код-валидатор шире CHECK,
      # диапазонный CHECK без проверки в пишущем файле, белый список кода с
      # значением вне ENUM и литерал в INSERT/UPDATE, которого нет в ENUM.
      - run: npm run check:enum-constraints

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --reporter=verbose
      - name: Android cleartext guard (этап 35)
        run: node scripts/check-native-config.mjs
      - run: npx vite build

  server-test:
    name: Server Tests (Vitest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Init test DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
        env:
          MYSQL_PWD: swiftmatch_test
      - name: Seed applied migrations (этап 79)
        run: node scripts/seed-migrations.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Apply DB migrations (этап 78)
        run: node database/migrations/migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Validate schema vs live DB (этап 35)
        run: node scripts/schema-validate.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: EXPLAIN audit all SQL queries
        run: node scripts/sql-explain-audit.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Backup restore smoke test
        run: node scripts/verify-backup.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - run: npm test -- --reporter=verbose
        working-directory: server
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
          JWT_SECRET: ci-test-jwt-secret-key
          PORT: 3002

  # Счётчики тестов в документации сверяются с прогоном: README,
  # project-context и test/ИНВЕНТАРЬ-ТЕСТОВ.md хранят числа, и они устаревают
  # каждый раз, когда добавлен тест. Отдельная джоба (нужны root и server
  # node_modules), в needs деплоя — иначе расхождение всплывёт уже на VPS.
  test-counters:
    name: Test counters vs docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: node scripts/test-counter-audit.mjs

  e2e-test:
    name: E2E Tests (Playwright)
    needs: [lint-and-typecheck, frontend-test, server-test]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install frontend deps
        run: npm ci
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Init DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
      - name: Seed applied migrations (этап 79)
        run: node scripts/seed-migrations.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Apply DB migrations (этап 78)
        run: node database/migrations/migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      # Сид демо-данных (этап 30): без него global-setup не может залогиниться
      # за user2@mail.ru/admin@mail.ru — в mysql_schema.sql нет ни одного
      # INSERT INTO users, все четыре storageState остаются пустыми, и 13
      # тестов падают на пустом стенде. Шаг отсутствовал, поэтому джоба
      # e2e-test никогда не была зелёной, а deploy зависит от неё.
      - name: Seed demo data
        run: node server/src/seed.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build frontend
        run: npx vite build
      - name: Start server
        run: |
          PORT=3002 DB_HOST=127.0.0.1 DB_USER=root DB_PASSWORD=swiftmatch_test DB_NAME=swiftmatch_test JWT_SECRET=ci-e2e-jwt-secret \
          node server/src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
      - name: Wait for API (этап 30)
        run: node scripts/wait-for-url.mjs http://127.0.0.1:3002/health --status 200 --timeout 120000
      - name: Start frontend
        run: |
          npx vite preview --port 8081 --strictPort &
          echo "VITE_PID=$!" >> $GITHUB_ENV
      - name: Wait for frontend (этап 30)
        run: node scripts/wait-for-url.mjs http://127.0.0.1:8081 --timeout 120000
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop services
        if: always()
        run: |
          kill $VITE_PID 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true

  docker-config-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      # Раньше здесь был `docker build ... | tail -5`: в GH Actions шаг идёт через
      # `bash -e`, а код возврата пайпа берётся у последней команды, то есть у
      # `tail`. Сломанная сборка давала exit 0 и зелёную галочку — гейт не
      # проверял ничего. Теперь пайпа нет, ошибка сборки валит шаг.
      - name: Build server Docker image
        run: docker build --target server -t swiftmatch-server-check .
      - name: Build web (nginx) Docker image
        run: docker build --target web -t swiftmatch-web-check .

      # ─── Trivy: уязвимости в образах (P3 #25) ───────────────────────────────
      # Сканируются ровно те образы, которые едут в прод: два собранных выше
      # плюс четыре сторонних из docker-compose.yml (db/redis/prometheus/grafana).
      # exit-code: 0 — первый прогон только собирает базовую линию (локально
      # Docker/Trivy на машине нет, базу смотреть было негде). Как только
      # baseline зафиксирован в артефакте, переводим на exit-code: 1 + .trivyignore
      # на осознанно принятые находки. SARIF уходит только по нашим образам:
      # CVE в чужих образах — не наш код, в Security-вкладке они только шумят.
      - name: Prepare Trivy output dir
        run: mkdir -p trivy
      - name: Trivy — server image (prod artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-server-check
          format: table
          output: trivy/server.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — web/nginx image (prod artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-web-check
          format: table
          output: trivy/web.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image mysql (docker-compose db)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mysql:8
          format: table
          output: trivy/base-mysql.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image redis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: redis:7-alpine
          format: table
          output: trivy/base-redis.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image prometheus
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/prometheus:latest
          format: table
          output: trivy/base-prometheus.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — base image grafana
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: grafana/grafana:latest
          format: table
          output: trivy/base-grafana.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — SARIF for our own images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-server-check
          format: sarif
          output: trivy/server.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy — SARIF for web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiftmatch-web-check
          format: sarif
          output: trivy/web.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Print scan results
        run: |
          for f in trivy/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy/server.sarif
          category: trivy-server-image
      - name: Upload SARIF (web) to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy/web.sarif
          category: trivy-web-image
      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan
          path: trivy/
          retention-days: 30

  deploy:
    name: Deploy to Production (Docker)
    needs: [lint-and-typecheck, frontend-test, server-test, e2e-test, test-counters]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push raw files to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude node_modules --exclude .git --exclude test-results --exclude playwright-report --exclude e2e/.auth --exclude .env --exclude '.env.*' --exclude '*.secret' --exclude '*-secret' --exclude '*.pem' --exclude '*.key' --exclude '*.p12' --exclude '*.pfx' --exclude 'id_*' --exclude uploads
          path: ./
          remote_path: /app/swiftmatch
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: 22
      - name: Build & migrate & deploy via Docker
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /app/swiftmatch
            # Прод-секреты лежат на VPS в /app/swiftmatch/.env (в git их нет).
            # Этап 20: rsync выше теперь исключает .env, поэтому --delete больше
            # НЕ стирает файл и эта строка срабатывает только на первом деплое.
            # Если .env всё же отсутствует, compose поднимет контейнер с
            # JWT_SECRET из шаблона, а middleware.js в production такой старт
            # отвергает — намеренно громко, вместо тихо сломанной подписи.
            test -f .env || cp .env.example .env
            # Собрать образы и запустить compose (schema применяется при первичном старте
            # пустого DB volume через docker-entrypoint-initdb.d — см. docker-compose.yml)
            docker compose up -d --build
            # Применить новые миграции && проверить схему против кода
            docker compose exec -T app node database/migrations/migrate.js
            docker compose exec -T app node scripts/schema-validate.mjs
            docker compose ps
