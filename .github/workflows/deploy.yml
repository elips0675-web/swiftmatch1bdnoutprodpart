name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check:ports
      - run: npm run lint
      - run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --reporter=verbose
      - name: Android cleartext guard (этап 35)
        run: node scripts/check-native-config.mjs
      - run: npx vite build

  server-test:
    name: Server Tests (Vitest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Init test DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
        env:
          MYSQL_PWD: swiftmatch_test
      - name: Seed applied migrations (этап 79)
        run: node scripts/seed-migrations.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Apply DB migrations (этап 78)
        run: node database/migrations/migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Validate schema vs live DB (этап 35)
        run: node scripts/schema-validate.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: EXPLAIN audit all SQL queries
        run: node scripts/sql-explain-audit.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Backup restore smoke test
        run: node scripts/verify-backup.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - run: npm test -- --reporter=verbose
        working-directory: server
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
          JWT_SECRET: ci-test-jwt-secret-key
          PORT: 3002

  e2e-test:
    name: E2E Tests (Playwright)
    needs: [lint-and-typecheck, frontend-test, server-test]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: swiftmatch_test
          MYSQL_DATABASE: swiftmatch_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install frontend deps
        run: npm ci
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Init DB schema
        run: mysql -h127.0.0.1 -uroot -pswiftmatch_test swiftmatch_test < database/mysql_schema.sql
      - name: Seed applied migrations (этап 79)
        run: node scripts/seed-migrations.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Apply DB migrations (этап 78)
        run: node database/migrations/migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: swiftmatch_test
          DB_NAME: swiftmatch_test
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Start server
        run: |
          PORT=3002 DB_HOST=127.0.0.1 DB_USER=root DB_PASSWORD=swiftmatch_test DB_NAME=swiftmatch_test JWT_SECRET=ci-e2e-jwt-secret \
          node server/src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 5
      - name: Start frontend
        run: |
          npx vite --port 8081 --host &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          sleep 5
      - name: Run E2E tests
        run: npx playwright test --reporter=html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Stop services
        if: always()
        run: |
          kill $VITE_PID 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true

  docker-config-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build Docker image (dry run)
        run: docker build --target server -t swiftmatch-check . 2>&1 | tail -5

  deploy:
    name: Deploy to Production
    needs: [lint-and-typecheck, frontend-test, server-test, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Build frontend
        run: npm ci && npx vite build
      - name: Install server deps (production)
        run: npm ci --omit=dev
        working-directory: server
      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/,server/,database/,scripts/schema-validate.mjs,scripts/sql-explain-audit.mjs,scripts/verify-backup.mjs,scripts/seed-migrations.mjs,package.json,package-lock.json"
          target: "/app/swiftmatch"
          strip_components: 0
      - name: Migrate + restart backend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app/swiftmatch
            set -a
            . ./server/.env
            set +a
            node scripts/schema-validate.mjs
            node scripts/sql-explain-audit.mjs
            node database/migrations/migrate.js
            cd server
            npm ci --omit=dev
            pm2 restart swiftmatch-api || pm2 start src/index.js --name swiftmatch-api
            sudo nginx -s reload || true
